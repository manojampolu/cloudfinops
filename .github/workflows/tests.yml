name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[aws,dev]"
      - run: pytest -q
      - run: cloudfinops demo --provider azure --out demo-azure
      - run: cloudfinops demo --provider aws --out demo-aws
      - name: Cloud Shell script (simulated Azure Cloud Shell)
        if: runner.os != 'Windows'
        run: CLOUDFINOPS_HOME="$PWD" CLOUDFINOPS_NO_UPDATE=1 CLOUDFINOPS_RUNS="$RUNNER_TEMP/runs" AZUREPS_HOST_ENVIRONMENT=ci bash cloudshell.sh demo --redact all < /dev/null
